<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merger Game Prototype</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="page page--lobby">
      <section class="panel room-shell">
        <div class="room-shell-header">
          <p class="small-label">Room Lobby</p>
          <h1>Acquire</h1>
        </div>

        <div class="room-shell-body">
          <section class="room-section room-controls-panel">
            <div class="field-row">
              <label for="player-name">Your name</label>
              <input id="player-name" placeholder="Letters and numbers only" maxlength="10">
            </div>

            <div class="field-row">
              <label for="invite-code">Invitation code</label>
              <input id="invite-code" placeholder="Required to create a room" maxlength="24">
            </div>

            <div class="field-row">
              <label for="room-password">Room password</label>
              <input id="room-password" type="password" placeholder="Required to create or enter a room" maxlength="24">
            </div>

            <div class="button-row room-create-row">
              <button id="create-room">Create Room</button>
            </div>

            <p class="status" id="status">Enter your name, invitation code, and a room password to create a room.</p>
          </section>

          <section class="room-section room-details-panel">
            <div class="available-rooms-block">
              <div class="available-rooms-header">
                <h2>Existing Rooms</h2>
                <button id="refresh-rooms" class="secondary-button" type="button">Refresh</button>
              </div>
              <div id="available-rooms" class="available-rooms"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
