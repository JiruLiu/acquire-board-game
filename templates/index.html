<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merger Game Prototype</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="page page--lobby">
      <section class="panel room-shell">
        <div class="room-shell-header">
          <p class="small-label">Room Lobby</p>
          <h1>Acquire</h1>
        </div>

        <div class="room-shell-body">
          <section class="room-section room-controls-panel">
            <div class="field-row">
              <label for="player-name">Your name</label>
              <input id="player-name" placeholder="Letters and numbers only" maxlength="10">
            </div>

            <div class="field-row">
              <label for="invite-code">Invitation code</label>
              <input id="invite-code" placeholder="Required to create a room" maxlength="24">
            </div>

            <div class="field-row">
              <label for="room-password">Room password</label>
              <input id="room-password" type="password" placeholder="Required to create or enter a room" maxlength="24">
            </div>

            <div class="room-options-row">
              <div class="field-row">
                <label for="game-mode">Game mode</label>
                <select id="game-mode">
                  <option value="classic">Classic · 2–5 · 9×12</option>
                  <option value="expanded">Expanded · 2–8 · 11×14</option>
                </select>
              </div>
              <div class="field-row seed-field-row">
                <label for="game-seed">Seed</label>
                <input id="game-seed" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Random" aria-describedby="seed-help">
              </div>
            </div>
            <span id="seed-help" class="seed-help">Optional · 0–4294967295</span>

            <div class="button-row room-create-row">
              <button id="create-room">Create Room</button>
            </div>

            <p class="status" id="status">Enter your details, choose a mode, and optionally set a reproducible seed.</p>
          </section>

          <section class="room-section room-details-panel">
            <div class="available-rooms-block">
              <div class="available-rooms-header">
                <h2>Existing Rooms</h2>
                <button id="refresh-rooms" class="secondary-button" type="button">Refresh</button>
              </div>
              <div id="available-rooms" class="available-rooms"></div>
            </div>
            <div class="recent-replays-block">
              <div class="recent-replays-header">
                <h2>Recent Replays</h2>
                <span class="recent-replays-limit">Last 10</span>
              </div>
              <div id="recent-replays" class="recent-replays"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
